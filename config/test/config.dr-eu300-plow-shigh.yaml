# Full Europe DR run: all PyPSA-Eur countries, 300 nodes, full year 2013 weather, high shift times, appliances grouped together by shift time
# achievable participation, 0.05 activation cost,
# 2025 demand and costs, operations only. Layer on top of config.dr-test.yaml.
run:
  name: EU300_grouped_w13_plow_shigh_dr

load:
  demand_response:
    group_by_shift: true

    devices:
      WM:
        shift_time: 12
      TD:
        shift_time: 12
      DW:
        shift_time: 12
      EV:
        shift_time: 8
      RF:
        shift_time: 2
      FR:
        shift_time: 2
      AC:
        shift_time: 2
      CP:
        shift_time: 2
      HP:
        shift_time: 4
      SH:
        shift_time: 24
      WH:
        shift_time: 24

countries: [AL, AT, BA, BE, BG, CH, CZ, DE, DK, EE, ES, FI, FR, GB, GR, HR, HU,
            IE, IT, LT, LU, LV, ME, MK, NL, "NO", PL, PT, RO, RS, SE, SI, SK, XK]

clustering:
  cluster_network:
    n_clusters: 300

electricity:
  extendable_carriers:    # operations only: nothing new can be built
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

solving:
  options:
    load_shedding:
      enable: true
      all_carriers: false
      carriers:
        AC: 100000
