# EU150 base case (achievable participation, O'Reilly shift times, default
# activation cost 0.05 EUR/MWh, grouped) with 2020 weather.
# Same as config.dr-eu150-plow-smid.yaml (2013) except for the weather year.
# Layer on top of config.dr-test.yaml + config.dr-eu100.yaml:
#
#   snakemake --cores 20 results/EU150_w20_plow_smid_g_dr/networks/solved_2025.nc \
#     --configfile config/test/config.dr-test.yaml config/test/config.dr-eu100.yaml \
#                  config/test/config.dr-eu150-w20.yaml config/config.solver-thesis.yaml
run:
  name: EU150_w20_plow_smid_g_dr

atlite:
  default_cutout: "europe-2020-sarah3-era5"

snapshots:
  start: "2020-01-01"
  end: "2021-01-01"
  inclusive: left

clustering:
  cluster_network:
    n_clusters: 150

load:
  demand_response:
    group_by_shift: true
